name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MCP_MODE: fake
      LLM_PROVIDER: fake
      REAL_LLM_SMOKE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Debug Python info
        run: |
          python --version
          python -m pip --version
          python -m pip debug --verbose

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Initialize demo DB
        run: python scripts/init_demo_db.py

      - name: Run tests
        run: python -m pytest -q

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Docker compose config (dev)
        run: docker compose config

      - name: Docker compose config (prod override)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config
